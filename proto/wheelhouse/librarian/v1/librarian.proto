syntax = "proto3";

package wheelhouse.librarian.v1;

// LibraryWriteEvent — carries an end-of-turn conversation segment from a
// client agent to the librarian for write-decision processing (ADR-042).
//
// One event per conversation turn per agent. Emitted automatically by the
// SDK when WH_LIBRARY_WRITE_STREAM is set. The librarian deserializes and
// feeds the segment to its decision policy.
message LibraryWriteEvent {
  string event_id = 1;          // UUID, generated by the client agent SDK
  string source_agent_id = 2;   // Agent that produced the turn
  string library_id = 3;        // Target Library identifier
  string conversation_id = 4;   // Conversation session identifier
  int64  timestamp_ms = 5;      // Unix epoch milliseconds
  repeated ConversationMessage segment = 6;  // The conversation turn(s)
  string locale = 7;            // Detected locale (ISO 639-1), e.g. "en", "fr"
  map<string, string> metadata = 8;  // Extensible metadata

  // Reserved for future evolution (TT-02)
  reserved 50 to 100;
}

// ConversationMessage — a single message within a conversation segment.
message ConversationMessage {
  string role = 1;     // "user" or "assistant"
  string content = 2;  // Message text
  int64  timestamp_ms = 3;

  // Reserved for future evolution (TT-02)
  reserved 50 to 100;
}
