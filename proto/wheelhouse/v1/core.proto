syntax = "proto3";

package wheelhouse.v1;

// TextMessage — plain text content published into a stream.
message TextMessage {
  string content = 1;
  string publisher_id = 2;
  int64 timestamp_ms = 3;

  // User ID referencing a registered UserProfile (FR59).
  // Present when message is from a human user via a surface; empty for agent messages.
  string user_id = 4;

  // Target user ID for response routing (FR59).
  // Set by agents when responding to a specific user.
  // Surfaces use this to route responses to the correct chat/session.
  string reply_to_user_id = 5;

  // Source stream name — populated by surfaces on inbound messages (Epic 10, Story 10.2).
  // Identifies which stream this message originated from.
  // Empty string for messages published by agents or non-surface publishers.
  string source_stream = 6;

  // Source topic name — human-readable topic label, populated by wh-telegram (Epic 10, Story 10.2).
  // For Telegram multi-chat surfaces: the topic name (e.g. "Iktos", "General").
  // Empty string for non-topic surfaces (CLI, single-stream Telegram).
  string source_topic = 7;

  // ─── Attachment fields (Library ingest from surfaces) ─────────────────
  //
  // When a user attaches a file in a surface (e.g. a PDF dropped in a
  // Telegram chat), the surface populates these three fields alongside
  // the text `content` (which holds any caption). Agents that have the
  // Library enabled can route such messages to the `library_ingest`
  // skill without the operator running `wh library ingest` manually.
  //
  // `attachment_bytes` is the raw file content. Size is capped
  // surface-side at 5 MiB; larger files are rejected with a clear
  // user-visible error before the envelope is built.
  //
  // `attachment_filename` is the original filename as reported by the
  // surface (Telegram `document.file_name`, CLI basename, etc.). Used
  // as the `source_ref` for provenance and dedup.
  //
  // `attachment_mime_type` is the MIME type reported by the surface
  // (Telegram `document.mime_type`). Agents map this to the
  // `library_ingest` `source_type` enum (`application/pdf` → `pdf`,
  // `text/*` → `text`/`markdown`).

  bytes attachment_bytes = 8;
  string attachment_filename = 9;
  string attachment_mime_type = 10;

  // Reserved for future evolution (TT-02)
  reserved 50 to 100;
  reserved "metadata";
}

// FileMessage — binary or file content published into a stream.
message FileMessage {
  string filename = 1;
  string mime_type = 2;
  bytes data = 3;
  string publisher_id = 4;
  int64 timestamp_ms = 5;

  // Reserved for future evolution (TT-02)
  reserved 50 to 100;
}

// Reaction — a lightweight reaction to a stream object.
message Reaction {
  string target_object_id = 1;
  string emoji = 2;
  string publisher_id = 3;
  int64 timestamp_ms = 4;

  // Reserved for future evolution (TT-02)
  reserved 50 to 100;
}
