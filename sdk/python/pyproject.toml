[project]
name = "wheelhouse"
version = "0.1.0"
description = "Python SDK for Wheelhouse — connect, publish, and subscribe to streams"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "The Wheelhouse Paris", email = "hello@wheelhouse.paris" },
]
dependencies = [
    "pyzmq>=25.0",
    "betterproto>=2.0.0b7",
    # Story 13-9: PDF text extraction for the library_ingest skill.
    # Pure-Python, MIT, actively maintained (successor to PyPDF2).
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyright>=1.1",
    "grpcio-tools>=1.60",
    "betterproto[compiler]>=2.0.0b7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
